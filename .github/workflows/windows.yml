name: windows-demo

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/windows.yml"
      - "samples/windows-jvm-demo/**"
      - "samples/windows-demo/**"
      - "compose-kn-windows/**"

jobs:
  # Windows 官方路径: Kotlin/JVM + Compose Desktop + skiko native dll (MSVC ABI)
  windows-jvm-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Windows app (jpackage → exe)
        shell: pwsh
        run: |
          gradle.bat -p samples/windows-jvm-demo packageDistributionForCurrentOS --no-daemon `
            "-Porg.gradle.jvmargs=-Xmx4g"

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: composekn-windows-jvm
          path: |
            samples/windows-jvm-demo/build/compose/binaries/main/**/*.exe
            samples/windows-jvm-demo/build/compose/binaries/main/**/*.msi
          if-no-files-found: error

  # Windows/Kotlin-Native: 目前止步于 ABI 边界 (skia MSVC vs K/N mingw Itanium)
  windows-native-mingw:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build windows demo (native)
        shell: pwsh
        run: |
          gradle.bat :samples:windows-demo:linkReleaseExecutableMingwX64 --no-daemon `
            "-Porg.gradle.jvmargs=-Xmx6g"
