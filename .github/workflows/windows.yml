name: windows-demo

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/windows.yml"
      - "compose-kn-windows/**"
      - "samples/windows-demo/**"
      - "vendor/skiko/**"
      - "build-logic/**"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build windows demo (release)
        shell: pwsh
        run: |
          gradle.bat :samples:windows-demo:linkReleaseExecutableMingwX64 --no-daemon --stacktrace `
            "-Porg.gradle.jvmargs=-Xmx6g"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-demo-exe
          path: |
            samples/windows-demo/build/bin/mingwX64/releaseExecutable/*.exe
          if-no-files-found: error
