# Publish ComposeKN Maven packages to GitHub Packages on version tags.
#
# Triggers: push tag v0.5.65 / v1.0.0 / …
# Artifacts:
#   com.composekn:compose-kn-bom|linux|windows|resources|skiko|composekn-catalog
#   com.composekn.compose:ui|foundation|material3|…
#   Gradle plugins: com.composekn.settings / host / resources / …
#   Release zip composekn-maven-<ver>.zip（含上述全部，供 fetch-composekn-maven.sh）
#
# Consumers: see CONSUMING.md

name: Publish GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_compose_ui:
        description: 'Also publish com.composekn.compose:* (UI klibs)'
        type: boolean
        default: true
      publish_skiko:
        description: 'Also publish com.composekn:skiko'
        type: boolean
        default: true
      pack_release_from_run:
        description: '仅从已有 Actions run 重打 Release zip（填 run id，跳过 publish）'
        type: string
        default: ''

permissions:
  contents: write
  packages: write

env:
  NIXPKGS_REV: c25784012c9982bca5b3e0de87e90bbdac8927d3
  NIXPKGS_URL: https://github.com/NixOS/nixpkgs/archive/c25784012c9982bca5b3e0de87e90bbdac8927d3.tar.gz

jobs:
  publish-hosts:
    name: Publish compose-kn-* hosts
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pack_release_from_run == '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('vendor/skiko/dependencies.toml', 'gradle.properties') }}

      - name: Install Linux native deps (pkg-config / Wayland / EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libcrypt-dev \
            libnotify-bin \
            zstd

      - name: Fetch mingw Skia prebuilt (for mingwX64 klib)
        run: ./scripts/fetch-skia-mingw.sh /tmp/composekn-skia-mingw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish hosts + BOM + resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NIXPKGS_URL: ${{ env.NIXPKGS_URL }}
          REQUIRE_MINGW: '1'
        run: |
          set -euo pipefail
          export SKIA_MINGW_PREBUILT="/tmp/composekn-skia-mingw/skia-mingw-$(cat vendor/skiko/skia-mingw/SKIA_TAG)"
          echo "Using SKIA_MINGW_PREBUILT=$SKIA_MINGW_PREBUILT"
          test -f "$SKIA_MINGW_PREBUILT/libs/libskia.a"
          # 不在此 --release：完整 zip 由 finalize-release 在 skiko/UI/plugins 齐后再打
          ./scripts/publish-composekn-packages.sh --github

      - name: Upload hosts maven-repo
        uses: actions/upload-artifact@v4
        with:
          name: composekn-hosts-maven
          path: build/maven-repo
          if-no-files-found: error
          retention-days: 3

  publish-skiko:
    name: Publish com.composekn:skiko
    runs-on: ubuntu-latest
    needs: publish-hosts
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.pack_release_from_run == '') && (github.event_name == 'workflow_dispatch' && inputs.publish_skiko || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('vendor/skiko/dependencies.toml', 'gradle.properties') }}

      - name: Install Linux native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libcrypt-dev \
            zstd

      - name: Fetch mingw Skia prebuilt
        run: ./scripts/fetch-skia-mingw.sh /tmp/composekn-skia-mingw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish skiko under com.composekn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NIXPKGS_URL: ${{ env.NIXPKGS_URL }}
        run: |
          set -euo pipefail
          export SKIA_MINGW_PREBUILT="/tmp/composekn-skia-mingw/skia-mingw-$(cat vendor/skiko/skia-mingw/SKIA_TAG)"
          echo "Using SKIA_MINGW_PREBUILT=$SKIA_MINGW_PREBUILT"
          test -f "$SKIA_MINGW_PREBUILT/libs/libskia.a"
          nix-shell ./shell.nix -I "nixpkgs=$NIXPKGS_URL" --keep SKIA_MINGW_PREBUILT --keep GITHUB_TOKEN --keep GITHUB_ACTOR --keep GITHUB_REPOSITORY_OWNER --keep GITHUB_REPOSITORY --run '
            set -euo pipefail
            which x86_64-w64-mingw32-g++
            x86_64-w64-mingw32-g++ --version | head -1
            test -f "$SKIA_MINGW_PREBUILT/libs/libskia.a"
            ./scripts/publish-skiko-composekn.sh
          '

      - name: Upload skiko maven-repo for UI job
        uses: actions/upload-artifact@v4
        with:
          name: composekn-skiko-maven
          path: build/maven-repo/com/composekn
          if-no-files-found: error
          retention-days: 3

  publish-compose-ui:
    name: Publish com.composekn.compose:*
    runs-on: ubuntu-latest
    needs: publish-skiko
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.pack_release_from_run == '') && (github.event_name == 'workflow_dispatch' && inputs.publish_compose_ui || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('vendor/skiko/dependencies.toml', 'gradle.properties') }}

      - name: Download skiko maven-repo from publish-skiko
        uses: actions/download-artifact@v4
        with:
          name: composekn-skiko-maven
          path: build/maven-skiko-wrap

      - name: Publish compose-core UI modules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p build/maven-repo/com/composekn
          # 摊平 upload-artifact 可能多包的一层 composekn/
          if [ -d build/maven-skiko-wrap/composekn ]; then
            cp -a build/maven-skiko-wrap/composekn/. build/maven-repo/com/composekn/
          elif [ -d build/maven-skiko-wrap/com/composekn ]; then
            cp -a build/maven-skiko-wrap/com/composekn/. build/maven-repo/com/composekn/
          else
            cp -a build/maven-skiko-wrap/. build/maven-repo/com/composekn/
          fi
          ls -la build/maven-repo/com/composekn/
          test -d build/maven-repo/com/composekn/skiko
          test -d build/maven-repo/com/composekn/skiko-linuxx64
          chmod +x ./scripts/publish-compose-ui-composekn.sh
          ./scripts/publish-compose-ui-composekn.sh

      - name: Upload UI maven-repo
        uses: actions/upload-artifact@v4
        with:
          name: composekn-ui-maven
          path: build/maven-repo
          if-no-files-found: error
          retention-days: 3

  publish-plugins:
    name: Publish Gradle plugins + catalog
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pack_release_from_run == '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish plugins + catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/publish-composekn-plugins.sh
          ./scripts/publish-composekn-plugins.sh

      - name: Upload plugins maven-repo
        uses: actions/upload-artifact@v4
        with:
          name: composekn-plugins-maven
          path: build/maven-repo
          if-no-files-found: error
          retention-days: 3

  finalize-release:
    name: Pack Release maven zip
    runs-on: ubuntu-latest
    needs: [publish-hosts, publish-skiko, publish-compose-ui, publish-plugins]
    # hosts+plugins 必成；skiko/UI 在 dispatch 关闭时可能 skipped；pack_release_from_run 走独立 job
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.pack_release_from_run == '') && needs.publish-hosts.result == 'success' && needs.publish-plugins.result == 'success' && (needs.publish-skiko.result == 'success' || needs.publish-skiko.result == 'skipped') && (needs.publish-compose-ui.result == 'success' || needs.publish-compose-ui.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      # upload-artifact@v4 把目录名作为 artifact 根；下到 build/ 即可还原 build/maven-repo/
      - name: Download hosts maven
        uses: actions/download-artifact@v4
        with:
          name: composekn-hosts-maven
          path: build

      - name: Download UI maven (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: composekn-ui-maven
          path: build/maven-merge-ui-wrap

      - name: Download plugins maven
        uses: actions/download-artifact@v4
        with:
          name: composekn-plugins-maven
          path: build/maven-merge-plugins-wrap

      - name: Merge maven trees + upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 摊平：hosts 可能是 build/maven-repo/… 或 build/maven-repo/maven-repo/…
          flatten_into() {
            local src="$1" dest="$2"
            mkdir -p "$dest"
            if [ -d "$src/maven-repo/com" ]; then
              cp -a "$src/maven-repo/." "$dest/"
            elif [ -d "$src/com" ]; then
              cp -a "$src/." "$dest/"
            elif [ -d "$src" ]; then
              cp -a "$src/." "$dest/"
            fi
          }
          mkdir -p build/maven-repo
          # hosts 已下到 build/；若直接是 maven-repo 则已就位
          if [ -d build/maven-repo/maven-repo/com ]; then
            shopt -s dotglob
            mv build/maven-repo/maven-repo/* build/maven-repo/
            rm -rf build/maven-repo/maven-repo
            shopt -u dotglob
          fi
          flatten_into build/maven-merge-ui-wrap build/maven-repo
          flatten_into build/maven-merge-plugins-wrap build/maven-repo
          echo "=== maven-repo tree (top) ==="
          ls -la build/maven-repo/ | head -30
          find build/maven-repo -name '*.klib' | wc -l
          test -d build/maven-repo/com/composekn
          chmod +x ./scripts/publish-composekn-packages.sh
          # 纯打包，不跑 gradle
          ./scripts/publish-composekn-packages.sh --release

  # 从已有成功 publish 的 run 重打 Release zip（不重编）
  pack-release-from-run:
    name: Pack Release from prior run
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pack_release_from_run != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts from prior run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.pack_release_from_run }}"
          mkdir -p build/art
          gh run download "$RUN_ID" -n composekn-hosts-maven -D build/art/hosts
          gh run download "$RUN_ID" -n composekn-plugins-maven -D build/art/plugins || true
          gh run download "$RUN_ID" -n composekn-ui-maven -D build/art/ui || true
          ls -laR build/art | head -80

      - name: Merge + upload Release zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flatten_into() {
            local src="$1" dest="$2"
            mkdir -p "$dest"
            if [ -d "$src/maven-repo/com" ]; then
              cp -a "$src/maven-repo/." "$dest/"
            elif [ -d "$src/com" ]; then
              cp -a "$src/." "$dest/"
            elif [ -d "$src" ]; then
              cp -a "$src/." "$dest/"
            fi
          }
          mkdir -p build/maven-repo
          flatten_into build/art/hosts build/maven-repo
          flatten_into build/art/ui build/maven-repo
          flatten_into build/art/plugins build/maven-repo
          if [ -d build/maven-repo/maven-repo/com ]; then
            shopt -s dotglob
            mv build/maven-repo/maven-repo/* build/maven-repo/
            rm -rf build/maven-repo/maven-repo
            shopt -u dotglob
          fi
          echo "klibs: $(find build/maven-repo -name '*.klib' | wc -l)"
          test -d build/maven-repo/com/composekn
          chmod +x ./scripts/publish-composekn-packages.sh
          ./scripts/publish-composekn-packages.sh --release
