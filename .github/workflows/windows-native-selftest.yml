name: windows-native-selftest

# 在 ubuntu runner 上「构建 HEAD 的 Windows 原生 exe，然后跑 exe 内置的自检」。
#
# 为什么 Linux 上能跑 Windows exe：
#   * mingwX64 本来就是交叉编译目标 —— konan 的 Windows 工具链就是「在 Linux/macOS
#     上跑的 msys2 版 clang + lld」，所以整条构建链路在 Linux 上是原生的；
#   * exe 是纯 Win32（软件光栅 + GDI，不依赖任何 DLL），Wine 完全跑得动；
#   * window 阶段需要 X → scripts/test-windows-native.sh 自己起 Xvfb。
#
# 为什么不会每次重编 Skia（从源码要半小时+、15GB 磁盘）：
#   vendor/skiko/skia-mingw 的**预编译包**（约 40MB）把 22 个 Skia 静态库 +
#   运行期库 + shim 一起发布在 Release 资产里，链接期只需要 konan 自带的 lld。
#   下载见 scripts/fetch-skia-mingw.sh（带 sha256 校验），细节见
#   vendor/skiko/skia-mingw/README-prebuilt.md。
#
# 为什么必须 pin nixpkgs：
#   预编译包里的静态库是用 nixpkgs 交叉工具链（GCC 15 / UCRT / mcfgthread）构建的，
#   宿主工具链换一个 ABI 家族就会链接失败。pin 到和本地构建时同一个 commit。

on:
  workflow_dispatch:
    inputs:
      build_skia:
        description: "先从源码构建 mingw-Skia（约 40 分钟；仅在预编译资产不可用时用）"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/windows-native-selftest.yml"
      - "compose-kn-windows/**"
      - "compose-kn-ui/**"
      - "samples/windows-demo/**"
      - "vendor/skiko/**"
      - "vendor/compose-core/**"
      - "vendor/compose-core.local/**"
      - "build-logic/**"
      - "scripts/**"
      - "shell.nix"
      - "settings.gradle.kts"
      - "gradle.properties"
  pull_request:
    paths:
      - "compose-kn-windows/**"
      - "samples/windows-demo/**"
      - "vendor/skiko/**"
      - "scripts/**"
      - "build-logic/**"

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

env:
  # 本地构建预编译包时用的 nixpkgs commit（见 package-prebuilt.sh 写进 manifest.json 的值）
  NIXPKGS_REV: c25784012c9982bca5b3e0de87e90bbdac8927d3
  NIXPKGS_URL: https://github.com/NixOS/nixpkgs/archive/c25784012c9982bca5b3e0de87e90bbdac8927d3.tar.gz
  # ⚠️ 不要叫 SKIA_DIR：那是 skiko 自己的约定（skiko 的 `skia.dir` 读环境变量 SKIA_DIR），
  # 指过去之后它会把预编译包目录当成 Skia 源码树，-I 全部指向不存在的 include/ →
  # :skiko:compileNativeBridgesWindowsX64 报 "SkCanvas.h: No such file or directory"。
  COMPOSEKN_SKIA_MINGW_DIR: ${{ github.workspace }}/.skia-mingw

jobs:
  build-and-selftest:
    name: 构建 exe + 原生自检
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 已于 2026-09-13 跑绿（run 34750507633：73 + 18 + 3 条断言全过），
    # 因此它是真正的门禁，不再是 continue-on-error。
    # 如果将来 runner 环境变化导致它红了，先看 job 摘要里的 SELFTEST 行与
    # 上传的 artifacts（exe / *.log / *.png）——常见坑见文件内注释与 HANDOVER §14.10。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Print pinned nixpkgs version
        run: nix-instantiate --eval -I nixpkgs=$NIXPKGS_URL --expr '(import <nixpkgs> {}).lib.version'

      # konan 工具链 + 宿主依赖（2~3GB），命中缓存时省掉这几分钟
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('vendor/skiko/dependencies.toml', 'gradle.properties') }}

      - name: Cache mingw-Skia prebuilt package
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSEKN_SKIA_MINGW_DIR }}
          key: skia-mingw-${{ hashFiles('vendor/skiko/skia-mingw/prebuilt.sha256', 'vendor/skiko/skia-mingw/SKIA_TAG') }}

      - name: Fetch mingw-Skia prebuilt package
        if: steps.skia-cache.outputs.cache-hit != 'true'
        env:
          # 仓库是私有的：Release 资产必须带 token 才能下载（否则 curl 拿到 404）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v zstd >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends zstd
          ./scripts/fetch-skia-mingw.sh "$COMPOSEKN_SKIA_MINGW_DIR"
          cat "$COMPOSEKN_SKIA_MINGW_DIR"/skia-mingw-*/manifest.json

      # 从源码构建 Skia 的兜底路径（workflow_dispatch + 勾选 build_skia）
      - name: Build mingw-Skia from source (fallback)
        if: github.event_name == 'workflow_dispatch' && inputs.build_skia
        run: |
          nix-shell -p gn ninja python3 git zstd --run "
            export SKIA_MINGW_WORK='$COMPOSEKN_SKIA_MINGW_DIR/src'
            nix-shell ./shell.nix -I nixpkgs=$NIXPKGS_URL --run ./vendor/skiko/skia-mingw/build-skia-mingw.sh
            nix-shell ./shell.nix -I nixpkgs=$NIXPKGS_URL --run ./vendor/skiko/skia-mingw/package-prebuilt.sh
          "
          ls -la "$COMPOSEKN_SKIA_MINGW_DIR"/src/prebuilt/

      - name: Resolve prebuilt dir
        id: prebuilt
        run: |
          if [ -f "$COMPOSEKN_SKIA_MINGW_DIR/skia-mingw-$(cat vendor/skiko/skia-mingw/SKIA_TAG)/manifest.json" ]; then
              dir="$COMPOSEKN_SKIA_MINGW_DIR/skia-mingw-$(cat vendor/skiko/skia-mingw/SKIA_TAG)"
          else
              dir="$(find "$COMPOSEKN_SKIA_MINGW_DIR" -maxdepth 2 -name manifest.json -printf '%h\n' | head -1)"
          fi
          [ -n "$dir" ] || { echo "找不到预编译包（$COMPOSEKN_SKIA_MINGW_DIR）"; ls -la "$COMPOSEKN_SKIA_MINGW_DIR"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "使用预编译包: $dir"

      - name: Build windows-demo.exe (mingwX64)
        run: |
          nix-shell ./shell.nix -I nixpkgs=$NIXPKGS_URL --run \
            "SKIA_MINGW_PREBUILT='${{ steps.prebuilt.outputs.dir }}' ./vendor/skiko/skia-mingw/build-windows-native-demo.sh"
          ls -la samples/windows-demo/build/bin/mingwX64/releaseExecutable/

      # 窗口阶段（logic/window）需要 X；xwininfo/import 用于外部截图像素校验
      - name: Install Wine + X tooling
        run: |
          sudo apt-get update
          # 字体是必须的：exe 用 Skia 的 Windows 字体管理器，Wine 那边如果
          # 一个字体都没有，Compose 的 FontFamilyResolver 会直接
          # `IllegalStateException: Could not load font`（CI 上第一次跑就是这个问题）。
          # `fonts-wine` 是关键：Wine 自己的 tahoma/marlett 等 56 个字体在 Debian/Ubuntu
          # 里是**单独的包**，而 `--no-install-recommends` 不会把它带上 ——
          # 于是 Wine 里一个字体都没有，Skia 的 Windows 字体管理器直接
          # `IllegalStateException: Could not load font`（CI 上连栽两次就是它）。
          # `xdotool` 是 input 阶段用的：往 X 服务器打真实鼠标/键盘事件，
          # 验证 X11 -> wine -> wndproc 这条投递链路（PostMessage 证明不了它）。
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils xdotool imagemagick zstd fontconfig \
            fonts-wine fonts-liberation fonts-dejavu-core
          fc-cache -f >/dev/null 2>&1 || true
          echo "--- 字体自检 ---"
          ls /usr/share/wine/fonts 2>/dev/null | head -5
          echo "wine fonts: $(ls /usr/share/wine/fonts 2>/dev/null | wc -l), host fonts: $(fc-list 2>/dev/null | wc -l)"
          # ubuntu 24.04 的 `wine64` 包只装 /usr/lib/wine/wine64（不在 PATH 里），
          # 提供 /usr/bin/wine 启动器的是 `wine` 这个包 —— 两个都装，别只装 wine64。
          sudo apt-get install -y --no-install-recommends wine
          sudo apt-get install -y --no-install-recommends wine64 || true
          (command -v wine64 || command -v wine || ls -la /usr/lib/wine/wine64) 2>&1 | head -5

      # 先把 wineprefix 建出来：第一次跑 wine 会自动创建 prefix，
      # 而「没有 DISPLAY 时创建 prefix」在 CI 上不稳定（logic 阶段是不带 X 跑的）。
      - name: Create Wine prefix
        env:
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
        run: |
          xvfb-run -a wineboot -u || true
          # 再跑一次：把上一步刚拷贝进去的字体登记到 Wine 的字体注册表里
          xvfb-run -a wineboot -u || true
          # 顺手把系统字体拷进 wineprefix 的 C:\windows\Fonts —— Skia 的 Windows
          # 字体管理器（DirectWrite）在 Wine 下就是从这儿找字体的，缺字体时
          # Compose 会 `Could not load font`。
          mkdir -p "$WINEPREFIX/drive_c/windows/Fonts"
          cp -n /usr/share/fonts/truetype/liberation/*.ttf "$WINEPREFIX/drive_c/windows/Fonts/" 2>/dev/null || true
          cp -n /usr/share/fonts/truetype/dejavu/*.ttf "$WINEPREFIX/drive_c/windows/Fonts/" 2>/dev/null || true
          ls "$WINEPREFIX/drive_c/windows/Fonts" | head -8
          ls "$WINEPREFIX" | head -5

      - name: Run native selftest (logic + window + input + screenshot)
        id: selftest
        env:
          SKIA_MINGW_PREBUILT: ${{ steps.prebuilt.outputs.dir }}
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          COMPOSEKN_WINTEST_DIR: ${{ runner.temp }}/composekn-wintest
        run: |
          set +e
          ./scripts/test-windows-native.sh --skip-build 2>&1 | tee "$RUNNER_TEMP/selftest.out"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo '## Windows 原生自检（Wine + Xvfb）'
            echo '```'
            grep -E '^SELFTEST' "$RUNNER_TEMP/selftest.out" | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # GPU 后端（GL/WGL）单独一关：主自检默认就是 GL（失败会自动回退软件，所以
      # 「跑过」不等于「GL 真的在用」）。这一步强制 COMPOSEKN_RENDER_API=gl，并在日志里
      # 断言真的走成了 GL —— 否则说明 CI 环境的 GL 不可用，需要显式暴露出来。
      - name: Assert GL(GPU) backend works
        env:
          SKIA_MINGW_PREBUILT: ${{ steps.prebuilt.outputs.dir }}
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/gl-backend-check"
          rm -rf "$run_dir"; mkdir -p "$run_dir"
          cp "${{ steps.prebuilt.outputs.dir }}/icudtl.dat" "$run_dir/"
          exe="$(find samples/windows-demo/build/bin -name windows-demo.exe -type f | head -1)"
          cp "$exe" "$run_dir/windows-demo.exe"
          export WINEDEBUG=-all
          export COMPOSEKN_RENDER_API=gl
          Xvfb :88 -screen 0 1024x768x24 -nolisten tcp >/dev/null 2>&1 &
          xp=$!
          export DISPLAY=:88
          for _ in $(seq 1 40); do [ -e /tmp/.X88-lock ] && break; sleep 0.25; done
          sleep 1
          ( cd "$run_dir" && wine ./windows-demo.exe ) >/dev/null 2>&1 &
          app=$!
          sleep 12
          kill -9 "$app" 2>/dev/null || true
          kill -9 "$xp" 2>/dev/null || true
          log="$run_dir/composekn-startup.log"
          echo '--- GL 后端断言 ---'
          grep -E 'gl: created GL_VERSION|skialayer: 使用 GL|呈现=opengl' "$log" | head -5 || true
          grep -q 'skialayer: 使用 GL' "$log" || { echo '!! 期望走 GL 后端，但日志里没有「使用 GL(GPU) 后端」'; exit 1; }
          grep -q '呈现=opengl' "$log" || { echo '!! 期望 profile 行显示 呈现=opengl(wgl swap-buffers)'; exit 1; }

      - name: Upload artifacts (exe / 日志 / 截图)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-selftest
          if-no-files-found: warn
          path: |
            samples/windows-demo/build/bin/mingwX64/releaseExecutable/windows-demo.exe
            ${{ runner.temp }}/composekn-wintest/*.log
            ${{ runner.temp }}/composekn-wintest/*.out
            ${{ runner.temp }}/composekn-wintest/*.png
