# ComposeKN coordinates / matrix（消费者与本仓库共用）
composekn.version=0.5.58
composekn.group=com.composekn

# 锁死：Compose UI 栈以 compose-core 源码基线为准（见 vendor/compose-core.local/VERSIONS）
composekn.compose.ui=1.12.1
# 发布到 GitHub Packages 的 UI 坐标版本（com.composekn.compose:*）
composekn.compose.ui.version=1.12.1-ckn.0.5.58
# 仅用于尚未被 substitution 顶掉的 Maven 坐标（runtime 等）；不得再当作「UI 基线」
composekn.compose.maven_deps=1.11.1
composekn.kotlin=2.4.0
composekn.coroutines=1.10.2

# JVM memory for Kotlin/Native multi-module compilation
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
